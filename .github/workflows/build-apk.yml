name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Game APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor & Android Platform
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Jungle Warfare Pro" "com.junglewarfare.pro" --web-dir dist
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Manifest for Landscape & Fullscreen
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/g' "$MANIFEST" || true
            sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" android:hardwareAccelerated="true" /g' "$MANIFEST" || true
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Organize APK Output
        run: |
          mkdir -p ./apk-output
          cp $(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1) ./apk-output/JungleWarfarePro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JungleWarfarePro-Android-APK
          path: ./apk-output/JungleWarfarePro.apk
          retention-days: 30
